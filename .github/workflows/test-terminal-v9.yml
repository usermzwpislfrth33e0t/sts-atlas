name: Visual test STS Terminal V9
on:
  push:
    paths: [.github/workflows/test-terminal-v9.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint STS terminal
        run: |
          node --check sts-terminal-v9.js
          grep -q 'sts-terminal-v9.js' index.html
          grep -q 'sts-terminal-v9.css' index.html
      - name: Install browser test harness with WebKit
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps webkit
      - name: Render entrance and complete original navigation transition
        run: |
          python3 -m http.server 8765 >/tmp/sts-http.log 2>&1 &
          node <<'JS'
          const {chromium,webkit}=require('playwright'),{execSync}=require('child_process');
          (async()=>{
            const bin=execSync('which google-chrome || which chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:bin,args:['--no-sandbox','--disable-gpu-sandbox']});
            const errors=[];
            const capture=async(page,id,selector)=>{
              const img=await page.locator(selector).screenshot({type:'jpeg',quality:61,animations:'disabled'});
              const b64=img.toString('base64');console.log('SHOT_START:'+id+':'+b64.length);
              for(let i=0;i<b64.length;i+=6000)console.log('SHOT_CHUNK:'+id+':'+i+':'+b64.slice(i,i+6000));
              console.log('SHOT_END:'+id);
            };
            const test=async(width,height,isMobile)=>{
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1,isMobile,hasTouch:isMobile});
              page.on('pageerror',e=>errors.push(e.stack||e.message));
              page.on('response',r=>{if(r.status()>=400)errors.push('HTTP '+r.status()+' '+r.url())});
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:50000});
              await page.waitForFunction(()=>window.STS_TERMINAL_V9_READY===true,{timeout:20000});
              await page.waitForTimeout(280);
              console.log('PORTAL_'+width,JSON.stringify(await page.evaluate(()=>{
                const p=document.querySelector('#portal'),c=document.querySelector('#sts9PortalMap'),b=p.getBoundingClientRect();
                return {metrics:[...p.querySelectorAll('.sts9-metric strong')].map(x=>x.textContent),
                  buttons:[...p.querySelectorAll('[data-sts9-destination]')].map(x=>x.dataset.sts9Destination),
                  width:b.width,bodyScrollWidth:document.documentElement.scrollWidth,
                  canvas:[c.width,c.height],nativeBtn:!!document.querySelector('#enterBtn')};
              })));
              if(await page.locator('.sts9-action').count()!==3)throw Error('missing portal commands');
              await capture(page,(isMobile?'mobile':'desktop')+'-portal','#portal');
              await page.locator('.sts9-action[data-sts9-destination="atlas"]').click();
              await page.waitForFunction(()=>document.querySelector('#sts9BootOverlay').classList.contains('sts9-boot-open'));
              await page.waitForTimeout(650);
              console.log('BOOT_STAGE_'+width,JSON.stringify(await page.evaluate(()=>({stage:document.querySelector('#sts9BootTitle').textContent,progress:document.querySelector('#sts9BootPct').textContent,rows:document.querySelectorAll('.sts9-boot-task').length}))));
              await capture(page,(isMobile?'mobile':'desktop')+'-boot','#sts9BootOverlay');
              await page.waitForFunction(()=>window.STS_TERMINAL_V9_STATE?.finished===true,{timeout:13000});
              await page.waitForTimeout(500);
              const result=await page.evaluate(()=>({
                bootHidden:document.querySelector('#sts9BootOverlay').getAttribute('aria-hidden'),
                active:document.querySelector('.view.active')?.id,
                destination:window.STS_TERMINAL_V9_STATE.destination,
                appVisible:document.querySelector('#app').classList.contains('ready'),
                nativeBootVisible:document.querySelector('#boot').classList.contains('visible')
              }));
              console.log('DESTINATION_'+width,JSON.stringify(result));
              if(result.active!=='atlasView'||!result.appVisible||result.bootHidden!=='true')throw Error('Navigation not working');
              await page.close();
            };
            await test(1300,870,false);
            await test(390,844,true);
            const wk=await webkit.launch({headless:true});
            const safari=await wk.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1'});
            const sp=await safari.newPage();const wkErrors=[];
            sp.on('pageerror',e=>wkErrors.push(e.stack||e.message));
            sp.on('requestfailed',r=>wkErrors.push('network '+r.url()+' '+r.failure()?.errorText));
            await sp.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:50000});
            await sp.waitForFunction(()=>window.STS_TERMINAL_V9_READY===true,{timeout:25000});
            console.log('WEBKIT_PORTAL',JSON.stringify(await sp.evaluate(()=>({
              commands:document.querySelectorAll('.sts9-action').length,
              width:document.documentElement.scrollWidth,canvases:document.querySelectorAll('canvas').length,
              buttons:[...document.querySelectorAll('.sts9-action')].map(e=>({mode:e.dataset.sts9Destination,rect:e.getBoundingClientRect().toJSON()}))
            }))));
            await sp.locator('.sts9-action[data-sts9-destination="atlas"]').tap();
            await sp.waitForTimeout(450);
            console.log('WEBKIT_BOOT',JSON.stringify(await sp.evaluate(()=>({boot:document.querySelector('#sts9BootOverlay')?.className,
              nativeBoot:document.querySelector('#boot')?.className,appReady:document.querySelector('#app')?.className,
              phase:window.STS_TERMINAL_V9_STATE?.phase}))));
            await sp.waitForTimeout(3500);
            console.log('WEBKIT_FINAL',JSON.stringify(await sp.evaluate(()=>({active:document.querySelector('.view.active')?.id,
              app:document.querySelector('#app').className,portalDisplay:document.querySelector('#portal').style.display,
              nativeBoot:document.querySelector('#boot').className,customBoot:document.querySelector('#sts9BootOverlay').className,
              state:window.STS_TERMINAL_V9_STATE}))));
            await capture(sp,'webkit-portal-after','#app');
            console.log('WEBKIT_ERRORS',JSON.stringify(wkErrors));await wk.close();
            console.log('JS_ERRORS',JSON.stringify(errors));
            await browser.close();
            if(errors.length)process.exitCode=1;
          })().catch(e=>{console.error('TEST_FAIL',e);process.exitCode=1});
          JS
