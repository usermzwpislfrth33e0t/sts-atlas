name: Vendor Three.js renderer
on:
  push:
    paths: [.github/workflows/vendor-three.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy pinned local ES modules
        run: |
          npm install --no-save --ignore-scripts three@0.181.0
          mkdir -p vendor
          cp node_modules/three/build/three.core.js vendor/three.core.js
          cp node_modules/three/build/three.module.js vendor/three.module.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/three.core.js vendor/three.module.js
          if ! git diff --cached --quiet; then
            git commit -m "Vendor pinned Three.js modules for local ship rendering"
            git push origin HEAD:main
          fi
