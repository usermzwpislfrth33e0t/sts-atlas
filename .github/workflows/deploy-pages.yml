name: Deploy STS Navigation Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STS Atlas
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Attach Shipyard V5 to the original HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          source = index.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./shipyard-v5.css?v=5.2">'
          script = '<script src="./shipyard-v5.js?v=5.2"></script>'
          if 'shipyard-v5.js' not in source:
              if '</head>' not in source or '</body></html>' not in source:
                  raise SystemExit('Cannot safely locate HTML insertion points')
              source = source.replace('</head>', css + '\n</head>', 1)
              source = source.replace('</body></html>', script + '\n</body></html>', 1)
              index.write_text(source, encoding='utf-8')
          source = source.replace('shipyard-v5.css?v=5.2', 'shipyard-v5.css?v=7.1')
          source = source.replace('shipyard-v5.js?v=5.2', 'shipyard-v5.js?v=7.1')
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source, encoding='utf-8')
          assert 'shipyard-v5.js?v=7.1' in source and 'shipyard-v5.css?v=7.1' in source
          PY
      - name: Make V5 part of the source (avoid competing Pages deployments)
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Include Shipyard V5 assets in published index.html"
            git push origin HEAD:main
          fi
      - name: Validate shipyard renderer syntax
        run: |
          node --check shipyard-v5.js
          node --check shipyard-v7.js
          test -s vendor/three.module.js
          test -s vendor/three.core.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
