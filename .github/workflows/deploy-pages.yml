name: Deploy STS Navigation Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STS Atlas
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Attach STS shipyard and station engineering modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          source = index.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./shipyard-v5.css?v=5.2">'
          script = '<script src="./shipyard-v5.js?v=5.2"></script>'
          if 'shipyard-v5.js' not in source:
              if '</head>' not in source or '</body></html>' not in source:
                  raise SystemExit('Cannot safely locate HTML insertion points')
              source = source.replace('</head>', css + '\n</head>', 1)
              source = source.replace('</body></html>', script + '\n</body></html>', 1)
              index.write_text(source, encoding='utf-8')
          source = source.replace('shipyard-v5.css?v=5.2', 'shipyard-v5.css?v=8.1')
          source = source.replace('shipyard-v5.js?v=5.2', 'shipyard-v5.js?v=8.1')
          source = source.replace('shipyard-v5.css?v=7.1', 'shipyard-v5.css?v=8.1')
          source = source.replace('shipyard-v5.js?v=7.1', 'shipyard-v5.js?v=8.1')
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source, encoding='utf-8')
          assert 'shipyard-v5.js?v=8.1' in source and 'shipyard-v5.css?v=8.1' in source
          station_css = '<link rel="stylesheet" href="./stationyard-v1.css?v=1.5">'
          station_js = '<script type="module" src="./stationyard.bundle.js?v=1.5"></script>'
          if 'stationyard-v1.css' not in source:
              source = source.replace('</head>', station_css + '\n</head>', 1)
          if 'stationyard-v1.js' not in source and 'stationyard.bundle.js' not in source:
              source = source.replace('</body></html>', station_js + '\n</body></html>', 1)
          source = source.replace('stationyard-v1.css?v=1.0', 'stationyard-v1.css?v=1.5')
          source = source.replace('stationyard-v1.css?v=1.2','stationyard-v1.css?v=1.5')
          source = source.replace('stationyard.bundle.js?v=1.3','stationyard.bundle.js?v=1.5')
          source = source.replace('stationyard-v1.js?v=1.0', 'stationyard.bundle.js?v=1.5')
          source = source.replace('stationyard-v1.js?v=1.2', 'stationyard.bundle.js?v=1.5')
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source, encoding='utf-8')
          ref_css='<link rel="stylesheet" href="./sts-reference-v2.css?v=2.2">'
          ref_js='<script defer src="./sts-reference-v2.js?v=2.2"></script>'
          if 'sts-reference-v2.css' not in source:
              source=source.replace('</head>',ref_css+'\n</head>',1)
          if 'sts-reference-v2.js' not in source:
              source=source.replace('</body></html>',ref_js+'\n</body></html>',1)
          source=source.replace('sts-reference-v2.js?v=2.1','sts-reference-v2.js?v=2.2')
          source=source.replace('sts-reference-v2.css?v=2.1','sts-reference-v2.css?v=2.2')
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source, encoding='utf-8')
          assert station_js in source and station_css in source
          assert ref_css in source and ref_js in source
          PY
      - name: Persist station and shipyard references in the source
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Include station engineering 3D assets in published index.html"
            git push origin HEAD:main
          fi
      - name: Validate shipyard renderer syntax
        run: |
          node --check shipyard-v5.js
          node --check shipyard-v7.js
          node --check stationyard-v1.js
          node --check sts-reference-v2.js
          test -s sts-reference-v2.css
          test -s stationyard-v1.css
          test -s vendor/three.module.js
          node --check stationyard.bundle.js
          node --check shipyard-v7.bundle.js
          test -s stationyard.bundle.js
          test -s shipyard-v7.bundle.js
          test -s vendor/three.core.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
