name: Deploy STS Navigation Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STS Atlas
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Move embedded BGM out of the initial HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          index=Path('index.html')
          source=index.read_text(encoding='utf-8')
          asset=Path('assets/sts-ambient.mp3')
          original='src="data:audio/mpeg;base64,'
          audio=source.find('<audio id="bgm"')
          if audio<0:
              raise SystemExit('STS music element is missing')
          pos=source.find(original,audio)
          if pos>=0:
              first=pos+len(original)
              last=source.find('"',first)
              if last<0:
                  raise SystemExit('Unclosed BGM asset')
              audio_bytes=base64.b64decode(source[first:last],validate=True)
              if len(audio_bytes)<100_000 or not (audio_bytes[:3]==b'ID3' or audio_bytes[:2] in (b'\xff\xfb',b'\xff\xf3')):
                  raise SystemExit('Unexpected source BGM format')
              asset.parent.mkdir(parents=True,exist_ok=True)
              asset.write_bytes(audio_bytes)
              source=source[:pos]+'src="./assets/sts-ambient.mp3"'+source[last+1:]
              index.write_text(source,encoding='utf-8')
              print('MOVED_BGM_BYTES',len(audio_bytes),'OLD_HTML_BYTES',last-pos,'NEW_HTML_BYTES',index.stat().st_size)
          else:
              print('BGM_ALREADY_EXTERNAL')
          source=index.read_text(encoding='utf-8')
          eager='src="./assets/sts-ambient.mp3"'
          lazy='data-src="./assets/sts-ambient.mp3"'
          if eager in source:
              source=source.replace(eager,lazy,1)
              index.write_text(source,encoding='utf-8')
              print('BGM_AUDIO_SRC_DEFERRED')
          assert lazy in index.read_text(encoding='utf-8')
          assert asset.is_file() and asset.stat().st_size>100_000
          assert original not in index.read_text(encoding='utf-8')
          PY
      - name: Attach STS shipyard and station engineering modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          source = index.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./shipyard-v5.css?v=5.2">'
          script = '<script src="./shipyard-v5.js?v=5.2"></script>'
          if 'shipyard-v5.js' not in source:
              if '</head>' not in source or '</body></html>' not in source:
                  raise SystemExit('Cannot safely locate HTML insertion points')
              source = source.replace('</head>', css + '\n</head>', 1)
              source = source.replace('</body></html>', script + '\n</body></html>', 1)
              index.write_text(source, encoding='utf-8')
          source = source.replace('shipyard-v5.css?v=5.2', 'shipyard-v5.css?v=8.1')
          source = source.replace('shipyard-v5.js?v=5.2', 'shipyard-v5.js?v=12.0')
          source = source.replace('shipyard-v5.css?v=7.1', 'shipyard-v5.css?v=8.1')
          source = source.replace('shipyard-v5.js?v=7.1', 'shipyard-v5.js?v=12.0')
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source, encoding='utf-8')
          assert 'shipyard-v5.js?v=12.0' in source and 'shipyard-v5.css?v=8.1' in source
          station_css = '<link rel="stylesheet" href="./stationyard-v1.css?v=12.0">'
          station_js = '<script type="module" src="./stationyard-v1.js?v=12.0"></script>'
          if 'stationyard-v1.css' not in source:
              source = source.replace('</head>', station_css + '\n</head>', 1)
          if 'stationyard-v1.js' not in source and 'stationyard.bundle.js' not in source:
              source = source.replace('</body></html>', station_js + '\n</body></html>', 1)
          source = source.replace('stationyard-v1.css?v=1.0', 'stationyard-v1.css?v=12.0')
          source = source.replace('stationyard-v1.css?v=1.2','stationyard-v1.css?v=12.0')
          source = source.replace('stationyard.bundle.js?v=1.3','stationyard.bundle.js?v=1.5')
          source = source.replace('stationyard-v1.js?v=1.0', 'stationyard.bundle.js?v=1.5')
          source = source.replace('stationyard-v1.js?v=1.2', 'stationyard.bundle.js?v=1.5')
          source = source.replace('stationyard.bundle.js?v=1.5', 'stationyard-v1.js?v=12.0')
          source = source.replace('stationyard-v1.js?v=1.5', 'stationyard-v1.js?v=12.0')
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source, encoding='utf-8')
          ref_css='<link rel="stylesheet" href="./sts-reference-v2.css?v=2.2">'
          ref_js='<script defer src="./sts-reference-v2.js?v=2.2"></script>'
          if 'sts-reference-v2.css' not in source:
              source=source.replace('</head>',ref_css+'\n</head>',1)
          if 'sts-reference-v2.js' not in source:
              source=source.replace('</body></html>',ref_js+'\n</body></html>',1)
          source=source.replace('sts-reference-v2.js?v=2.1','sts-reference-v2.js?v=2.2')
          source=source.replace('sts-reference-v2.css?v=2.1','sts-reference-v2.css?v=2.2')
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source, encoding='utf-8')
          assert station_js in source and station_css in source
          assert ref_css in source and ref_js in source
          terminal_css='<link rel="stylesheet" href="./sts-terminal-v9.css?v=10.1">'
          terminal_js='<script defer src="./sts-terminal-v9.js?v=10.1"></script>'
          if 'sts-terminal-v9.css' not in source:
              source=source.replace('</head>',terminal_css+'\n</head>',1)
          if 'sts-terminal-v9.js' not in source:
              source=source.replace('</body></html>',terminal_js+'\n</body></html>',1)
          source=source.replace('sts-terminal-v9.css?v=9.0','sts-terminal-v9.css?v=10.1')
          source=source.replace('sts-terminal-v9.js?v=9.0','sts-terminal-v9.js?v=10.1')
          source=source.replace('sts-terminal-v9.css?v=9.1','sts-terminal-v9.css?v=10.1')
          source=source.replace('sts-terminal-v9.js?v=9.1','sts-terminal-v9.js?v=10.1')
          source=source.replace('sts-terminal-v9.css?v=10.0','sts-terminal-v9.css?v=10.1')
          source=source.replace('sts-terminal-v9.js?v=10.0','sts-terminal-v9.js?v=10.1')
          # The original 2-second boot completion must not race the terminal
          # V10 sequence. Keep the old timer as a fallback if V10 is absent.
          timer='bootTimers.push(setTimeout(finishEntry,2020))'
          guarded="if(!document.documentElement.classList.contains('sts10-terminal'))bootTimers.push(setTimeout(finishEntry,2020))"
          if timer in source and guarded not in source:
              source=source.replace(timer,guarded,1)
          assert guarded in source
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source, encoding='utf-8')
          source=source.replace('sts-traffic-v11.js?v=11.0','sts-traffic-v11.js?v=12.0')
          source=source.replace('sts-traffic-v11.js?v=11.1','sts-traffic-v11.js?v=12.0')
          source=source.replace('sts-traffic-v11.css?v=11.1','sts-traffic-v11.css?v=12.0')
          source=source.replace('sts-traffic-v11.css?v=11.0','sts-traffic-v11.css?v=12.0')
          if index.read_text(encoding='utf-8') != source:
              index.write_text(source,encoding='utf-8')
          assert terminal_css in source and terminal_js in source
          PY
      - name: Validate shipyard renderer syntax
        run: |
          node --check shipyard-v5.js
          node --check shipyard-v7.js
          node --check stationyard-v1.js
          node --check sts-reference-v2.js
          node --check sts-terminal-v9.js
          test -s sts-terminal-v9.css
          test -s assets/sts-ambient.mp3
          test $(stat -c%s index.html) -lt 450000
          test -s sts-reference-v2.css
          test -s stationyard-v1.css
          node --check sts-traffic-v11.js
          test -s sts-traffic-v11.css
          grep -q 'sts-traffic-v11.js?v=12.0' index.html
          grep -q 'stationyard-v1.js?v=12.0' index.html
          test -s vendor/three.module.js
          node --check stationyard.bundle.js
          node --check shipyard-v7.bundle.js
          test -s stationyard.bundle.js
          test -s shipyard-v7.bundle.js
          test -s vendor/three.core.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
