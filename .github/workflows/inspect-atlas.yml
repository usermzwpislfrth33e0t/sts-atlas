name: Inspect Atlas integration
on:
  push:
    paths: [.github/workflows/inspect-atlas.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract navigation, render and simulation code
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          print('INDEX', len(s), 'LINES',len(s.splitlines()))
          patterns=['updateJourney(dt){','startJourney(','shipDir=','this.shipPos=','renderGL(){','renderFallback(){','journeyStart','renderOverlay(){']
          for q in patterns:
              hits=list(re.finditer(re.escape(q),s,re.I))
              print(f'\n#### {q} COUNT {len(hits)}')
              for m in hits[:4]:
                  print('\n',repr(s[max(0,m.start()-250):min(len(s),m.end()+2700)]))
          PY
